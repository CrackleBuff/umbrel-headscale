name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose file is up to date
        run: python3 tools/build.py --check
      - name: Init script tests (with the busybox from the pinned image)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          tools/fetch-busybox.sh "$RUNNER_TEMP/busybox-root"
          sudo BUSYBOX="$RUNNER_TEMP/busybox-root/bin/busybox" tests/test-init.sh
      - name: Compose guard rails (no host hooks, privileges or extra mounts)
        run: |
          python3 tools/check_compose.py
          python3 tests/test_check_compose.py
      - name: Image check logic tests
        run: python3 tests/test_verify_image.py
      - name: Images are pinned by digest
        run: |
          if grep -E '^\s*image:' cracklebuff-headscale/docker-compose.yml | grep -Ev '@sha256:[0-9a-f]{64}$'; then
            echo "unpinned image"; exit 1
          fi
      - name: Headscale image contains the official release binary
        run: python3 tools/verify_image.py
