# GENERATED by tools/build.py from src/ - edit src/ and re-run the build.
version: "3.7"

services:
  app_proxy:
    environment:
      # Status page only. Umbrel login stays required (default).
      APP_HOST: cracklebuff-headscale_web_1
      APP_PORT: 8080

  init:
    # One-shot: validates settings, renders config, fixes ownership/permissions.
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: on-failure
    command: ["sh", "-c", "# Runs as root in a throwaway busybox container with no network, a read-only\n# root filesystem and only CHOWN, DAC_OVERRIDE and FOWNER. It:\n#   1. validates the user's settings,\n#   2. renders /etc/headscale/config.yaml,\n#   3. creates a default-deny policy if none exists,\n#   4. fixes ownership and permissions of Headscale's state (uid 65532, 0700/0600),\n#   5. writes the status page.\n# It never reads or prints key material. Re-run on every app start.\nset -eu\numask 077\n\nHS_UID=65532\nHS_GID=65532\nCFG=/out/config\nLIB=/out/lib\nPOL=/out/policy\nWWW=/out/www\nST=/out/status\nPR=/out/probe\n\nDOMAIN=$$(printf '%s' \"$${HS_SERVER_DOMAIN:-}\" | tr 'A-Z' 'a-z' | tr -d ' ')\nEMAIL=$$(printf '%s' \"$${HS_ACME_EMAIL:-}\" | tr -d ' ')\nMAGIC=$$(printf '%s' \"$${HS_MAGICDNS_DOMAIN:-tailnet.internal}\" | tr 'A-Z' 'a-z' | tr -d ' ')\nTSDERP=$$(printf '%s' \"$${HS_TAILSCALE_DERP:-false}\" | tr 'A-Z' 'a-z')\nLOGLEVEL=$$(printf '%s' \"$${HS_LOG_LEVEL:-info}\" | tr 'A-Z' 'a-z')\nEXPIRY=$$(printf '%s' \"$${HS_NODE_EXPIRY:-180d}\" | tr 'A-Z' 'a-z')\n\nHOSTRE='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$$'\nSTATE=configured\nREASON=ok\n\nfail() { STATE=unconfigured; REASON=$$1; }\n\n# Settings must be single-line printable ASCII. grep tests each line on its\n# own, so a newline (or tab) could otherwise smuggle extra lines into the\n# generated config.yaml. Reject such values instead of stripping them.\nBADCHARS=\n# One line on purpose: umbrelOS rewrites the compose file and adds a line break\n# before indented lines, which breaks \"\\\" line continuations (see\n# tools/umbreld_rewrite.py). Never continue a line with a backslash here.\nfor v in \"$${HS_SERVER_DOMAIN:-}\" \"$${HS_ACME_EMAIL:-}\" \"$${HS_MAGICDNS_DOMAIN:-}\" \"$${HS_TAILSCALE_DERP:-}\" \"$${HS_LOG_LEVEL:-}\" \"$${HS_NODE_EXPIRY:-}\"; do\n  case \"$$v\" in *[![:print:]]*) BADCHARS=1;; esac\ndone\n\nif [ -n \"$$BADCHARS\" ]; then fail bad_characters\nelif [ -z \"$$DOMAIN\" ]; then fail no_domain\nelif ! printf '%s' \"$$DOMAIN\" | grep -Eq \"$$HOSTRE\" || [ $${#DOMAIN} -gt 253 ]; then fail bad_domain\nfi\nif [ \"$$STATE\" = configured ]; then\n  if [ -n \"$$EMAIL\" ] && ! printf '%s' \"$$EMAIL\" | grep -Eq '^[A-Za-z0-9._%+-]{1,64}@([A-Za-z0-9-]{1,63}\\.)+[A-Za-z]{2,63}$$'; then fail bad_email\n  elif ! printf '%s' \"$$MAGIC\" | grep -Eq \"$$HOSTRE\"; then fail bad_magicdns\n  elif [ \"$$MAGIC\" = \"$$DOMAIN\" ] || case \"$$DOMAIN\" in *.\"$$MAGIC\") true;; *) false;; esac; then fail magicdns_contains_server\n  elif [ \"$$TSDERP\" != true ] && [ \"$$TSDERP\" != false ]; then fail bad_derp\n  elif ! printf '%s' \"$$LOGLEVEL\" | grep -Eq '^(debug|info|warn|error)$$'; then fail bad_loglevel\n  elif ! printf '%s' \"$$EXPIRY\" | grep -Eq '^(0|[1-9][0-9]{0,4}(h|d))$$'; then fail bad_expiry\n  fi\nfi\n# Headscale accepts Go durations; convert days to hours.\n# Only do arithmetic on a value the regex above accepted (digits + d); never on raw input.\nif [ \"$$STATE\" = configured ]; then\n  case \"$$EXPIRY\" in [1-9]*d) EXPIRY=\"$$(( $${EXPIRY%d} * 24 ))h\";; esac\nfi\n\n# Refuse symlinks, devices, FIFOs and sockets anywhere in the data folder.\n# This script runs as root and writes or chowns files there, so a planted\n# symlink must never be followed.\n# A find error (unreadable entry, I/O error) also counts as unsafe.\nunsafe() {\n  _u=$$(find \"$$1\" \\( -type l -o -type b -o -type c -o -type p -o -type s \\) -print 2>&1) || return 0\n  [ -n \"$$_u\" ]\n}\n# config/, www/, status/ and probe/ are written even when Headscale stays\n# inert, so stop here without writing anything (the app will not start; see\n# its logs).\nfor d in \"$$CFG\" \"$$WWW\" \"$$ST\" \"$$PR\"; do\n  if unsafe \"$$d\"; then\n    echo \"init: refusing to start: $$d contains a symlink, device, FIFO or socket\" >&2\n    exit 1\n  fi\ndone\n# lib/ and policy/ are only written once configured, so report it on the status page.\nfor d in \"$$LIB\" \"$$POL\"; do\n  if unsafe \"$$d\"; then fail unsafe_files; fi\ndone\n\n# Headscale ALLOWS ALL traffic when the policy has neither an \"acls\" nor a\n# \"grants\" list: an empty file, \"{}\", \"acls\": null, a list hidden in a\n# /* comment */, or an \"acls\" key nested somewhere else. Refuse to start\n# rather than fail open. This small HuJSON scanner skips strings and\n# comments and prints \"ok\" only if the TOP-LEVEL object has an \"acls\" or\n# \"grants\" member (any case, as Headscale matches names case-insensitively)\n# whose value is a list. Anything it does not understand counts as unsafe.\nhas_rule_list() {\n  # Control characters (other than tab/CR/LF) are refused: the scanner reads\n  # the file as one awk record split on \\001, and Headscale allows such bytes\n  # inside comments, so they could hide a list from this check.\n  tr -d '\\000-\\010\\013\\014\\016-\\037\\177' < \"$$1\" | cmp -s - \"$$1\" || return 0\n  awk '\nBEGIN { RS = \"\\001\"; ok = 0; bad = 0 }\n{\n  s = $$0; n = length(s); depth = 0; i = 1; expect = \"\"; key = \"\"\n  while (i <= n) {\n    c = substr(s, i, 1)\n    if (c == \"/\" && substr(s, i + 1, 1) == \"/\") { j = index(substr(s, i), \"\\n\"); if (j == 0) break; i += j; continue }\n    if (c == \"/\" && substr(s, i + 1, 1) == \"*\") { j = index(substr(s, i + 2), \"*/\"); if (j == 0) { bad = 1; break }; i += j + 3; continue }\n    if (c ~ /[ \\t\\r\\n]/) { i++; continue }\n    if (c == \"\\\"\") {\n      str = \"\"; i++\n      while (i <= n) { d = substr(s, i, 1); if (d == \"\\\\\") { str = str d substr(s, i + 1, 1); i += 2; continue }; if (d == \"\\\"\") break; str = str d; i++ }\n      i++\n      if (depth == 1 && expect == \"\") { key = tolower(str); expect = \"colon\"; continue }\n      if (expect == \"value\") expect = \"\"\n      continue\n    }\n    if (expect == \"colon\") { if (c == \":\") { expect = \"value\"; i++; continue }; expect = \"\" }\n    if (expect == \"value\") { if ((key == \"acls\" || key == \"grants\") && c == \"[\") ok = 1; expect = \"\" }\n    if (c == \"{\" || c == \"[\") depth++\n    else if (c == \"}\" || c == \"]\") depth--\n    i++\n  }\n}\nEND { if (ok && !bad) print \"ok\" }\n' \"$$1\"\n}\n# Headscale never reads data/policy/ directly: it reads a copy in config/\n# that passed this check. A Headscale-only restart, a crash restart or SIGHUP\n# therefore reloads the last checked policy, never an unchecked edit. The\n# copy is checked (not the original) so the file cannot change in between.\nrm -f \"$$CFG/policy.hujson.new\"\nif [ \"$$STATE\" = configured ] && [ -e \"$$POL/policy.hujson\" ]; then\n  if [ ! -f \"$$POL/policy.hujson\" ]; then\n    fail implicit_allow_all\n  else\n    cat \"$$POL/policy.hujson\" > \"$$CFG/policy.hujson.new\"\n    if [ \"$$(has_rule_list \"$$CFG/policy.hujson.new\")\" != ok ]; then fail implicit_allow_all; fi\n  fi\nfi\n\n# The status page is regenerated below; drop anything else that is in www/.\nfind \"$$WWW\" -mindepth 1 -delete\nmkdir -p \"$$CFG\" \"$$WWW/cgi-bin\" \"$$ST\"\n\nif [ \"$$STATE\" = configured ]; then\n  if [ \"$$TSDERP\" = true ]; then DERPURLS='[\"https://controlplane.tailscale.com/derpmap/default\"]'; else DERPURLS='[]'; fi\n  cat > \"$$CFG/config.yaml.new\" <<CONF\n# Generated by the app on every start from the app's settings. Do not edit:\n# changes are overwritten. Change settings in umbrelOS instead.\nserver_url: https://$$DOMAIN\nlisten_addr: 0.0.0.0:8443\nmetrics_listen_addr: 127.0.0.1:9090\ngrpc_listen_addr: 127.0.0.1:50443\ngrpc_allow_insecure: false\ntrusted_proxies: []\nnoise:\n  private_key_path: /var/lib/headscale/noise_private.key\nprefixes:\n  v4: 100.64.0.0/10\n  v6: fd7a:115c:a1e0::/48\n  allocation: sequential\nderp:\n  server:\n    enabled: true\n    region_id: 999\n    region_code: \"umbrel\"\n    region_name: \"Umbrel embedded DERP\"\n    verify_clients: true\n    stun_listen_addr: \"0.0.0.0:3478\"\n    private_key_path: /var/lib/headscale/derp_server_private.key\n    automatically_add_embedded_derp_region: true\n  urls: $$DERPURLS\n  paths: []\n  auto_update_enabled: $$TSDERP\n  update_frequency: 24h\ndisable_check_updates: true\nnode:\n  expiry: $$EXPIRY\n  ephemeral:\n    inactivity_timeout: 30m\ndatabase:\n  type: sqlite\n  sqlite:\n    path: /var/lib/headscale/db.sqlite\n    write_ahead_log: true\n    wal_autocheckpoint: 1000\nacme_url: https://acme-v02.api.letsencrypt.org/directory\nacme_email: \"$$EMAIL\"\ntls_letsencrypt_hostname: \"$$DOMAIN\"\ntls_letsencrypt_cache_dir: /var/lib/headscale/cache\ntls_letsencrypt_challenge_type: TLS-ALPN-01\ntls_cert_path: \"\"\ntls_key_path: \"\"\nlog:\n  level: $$LOGLEVEL\n  format: text\npolicy:\n  mode: file\n  path: /etc/headscale/policy.hujson\ndns:\n  magic_dns: true\n  base_domain: $$MAGIC\n  override_local_dns: false\n  nameservers:\n    global: []\n    split: {}\n  search_domains: []\n  extra_records: []\nunix_socket: /var/run/headscale/headscale.sock\nunix_socket_permission: \"0770\"\nlogtail:\n  enabled: false\ntaildrop:\n  enabled: true\nauto_update:\n  enabled: false\nCONF\n\n  # Default-deny policy, created only if the user has none yet. Never overwritten.\n  if [ ! -e \"$$POL/policy.hujson\" ]; then\n    cat > \"$$POL/policy.hujson\" <<'POLICY'\n// Headscale access policy (HuJSON). Default: DENY ALL.\n// Nodes can join, but cannot reach each other until you add rules.\n// Edit this file, then restart the app. Examples:\n// https://headscale.net/stable/ref/policy/  and the app's README.\n//\n// IMPORTANT: an empty file or \"{}\" means ALLOW ALL. Keep an \"acls\"\n// (or \"grants\") list in this file, even if it is empty.\n{\n  \"groups\": {},\n  \"tagOwners\": {},\n  \"hosts\": {},\n  \"acls\": []\n}\nPOLICY\n  fi\n  mkdir -p \"$$LIB/cache\"\n  chown -R -h \"$$HS_UID:$$HS_GID\" \"$$LIB\"\n  find \"$$LIB\" -type d -exec chmod 0700 {} +\n  find \"$$LIB\" -type f -exec chmod 0600 {} +\n  chown -h \"0:$$HS_GID\" \"$$POL\" \"$$POL/policy.hujson\"\n  chmod 0750 \"$$POL\"; chmod 0640 \"$$POL/policy.hujson\"\n  # New install: the copy is the default policy written just above.\n  if [ ! -e \"$$CFG/policy.hujson.new\" ]; then cat \"$$POL/policy.hujson\" > \"$$CFG/policy.hujson.new\"; fi\n  chown -h \"0:$$HS_GID\" \"$$CFG/policy.hujson.new\"; chmod 0640 \"$$CFG/policy.hujson.new\"\n  mv -f \"$$CFG/policy.hujson.new\" \"$$CFG/policy.hujson\"\nelse\n  # Not configured: run Headscale in an inert, localhost-only mode with state\n  # in tmpfs, so nothing is created in the data folder (keys, db) and nothing\n  # answers on the published ports. This keeps the data folder empty, which is\n  # what the migration (copy existing state in) relies on.\n  cat > \"$$CFG/config.yaml.new\" <<'CONF'\n# Not configured yet. Set \"Public domain\" in the app's settings.\nserver_url: http://127.0.0.1:8443\nlisten_addr: 127.0.0.1:8443\nmetrics_listen_addr: 127.0.0.1:9090\ngrpc_listen_addr: 127.0.0.1:50443\nnoise:\n  private_key_path: /tmp/inert/noise_private.key\nprefixes:\n  v4: 100.64.0.0/10\n  v6: fd7a:115c:a1e0::/48\nderp:\n  server:\n    enabled: false\n  urls: []\n  paths: [/etc/headscale/derp-inert.yaml]\n  auto_update_enabled: false\ndisable_check_updates: true\ndatabase:\n  type: sqlite\n  sqlite:\n    path: /tmp/inert/db.sqlite\nlog:\n  level: warn\npolicy:\n  mode: file\n  path: \"\"\ndns:\n  magic_dns: false\n  override_local_dns: false\nunix_socket: /var/run/headscale/headscale.sock\nunix_socket_permission: \"0770\"\nlogtail:\n  enabled: false\nCONF\n  # Headscale refuses to start without a DERP map; give it an unreachable one.\n  cat > \"$$CFG/derp-inert.yaml\" <<'DERP'\nregions:\n  900:\n    regionid: 900\n    regioncode: inert\n    regionname: Not configured\n    nodes:\n      - name: 900a\n        regionid: 900\n        hostname: localhost\n        ipv4: 127.0.0.1\n        stunport: -1\n        derpport: 1\nDERP\n  chown -h \"0:$$HS_GID\" \"$$CFG/derp-inert.yaml\"; chmod 0640 \"$$CFG/derp-inert.yaml\"\nfi\n# Remove the inert DERP map once configured, and the checked policy copy when not.\nif [ \"$$STATE\" = configured ]; then rm -f \"$$CFG/derp-inert.yaml\"; else rm -f \"$$CFG/policy.hujson\" \"$$CFG/policy.hujson.new\"; fi\n\nchown -h \"0:$$HS_GID\" \"$$CFG\" \"$$CFG/config.yaml.new\"\nchmod 0750 \"$$CFG\"; chmod 0640 \"$$CFG/config.yaml.new\"\nmv -f \"$$CFG/config.yaml.new\" \"$$CFG/config.yaml\"\n\n# Status page state: only validated values, no secrets.\n{\n  echo \"STATE=$$STATE\"\n  echo \"REASON=$$REASON\"\n  if [ \"$$STATE\" = configured ]; then echo \"DOMAIN=$$DOMAIN\"; echo \"TSDERP=$$TSDERP\"; echo \"MAGIC=$$MAGIC\"; fi\n} > \"$$ST/state.new\"\nchmod 0644 \"$$ST/state.new\"; mv -f \"$$ST/state.new\" \"$$ST/state\"\nchown -h 0:0 \"$$ST\" \"$$ST/state\"; chmod 0755 \"$$ST\"\n\n# Reachability results from the probe service (written as uid 65534). Start\n# empty so an old result is never shown for a new domain.\nfind \"$$PR\" -mindepth 1 -delete\nchown -h 65534:65534 \"$$PR\"; chmod 0755 \"$$PR\"\n\n# Status page files (static HTML + one CGI). Rewritten on every start.\ncat > \"$$WWW/index.html\" <<'HSWWWINDEX'\n<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Headscale</title>\n<style>\nbody{font-family:system-ui,-apple-system,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;color:#1d1d1f;background:#fafafa}\nh1{font-size:1.6rem}code,pre{background:#eee;border-radius:4px;padding:.1rem .3rem;font-size:.9em}pre{padding:.6rem;overflow:auto}\n.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem 1.2rem;margin:1rem 0}\n.ok{color:#0a7d32}.bad{color:#b00020}.muted{color:#666}td{padding:.2rem .8rem .2rem 0;vertical-align:top}\n</style></head><body>\n<h1>Headscale</h1>\n<p class=\"muted\">Self-hosted Tailscale control server. This page is protected by your Umbrel login and only shows status; it cannot change anything.</p>\n<div class=\"card\" id=\"status\">Loading status...</div>\n<div class=\"card\">\n<h2>Connect a device</h2>\n<p>Official Tailscale apps work with Headscale. Point them at your server URL:</p>\n<pre>tailscale up --login-server https://<span class=\"dom\">YOUR-DOMAIN</span></pre>\n<p>On iOS/macOS/Android set a custom coordination server in the app settings. The device shows a register page with an ID; approve it on the Umbrel (Settings &rarr; Advanced &rarr; Terminal):</p>\n<pre>sudo docker exec cracklebuff-headscale_headscale_1 headscale users create alice\nsudo docker exec cracklebuff-headscale_headscale_1 headscale auth register --user alice --auth-id &lt;ID&gt;</pre>\n<p>New tailnets <b>deny all traffic</b> until you add rules to the policy file. See the README.</p>\n</div>\n<div class=\"card\"><h2>Docs</h2><p>README, threat model and backup/upgrade notes: <a href=\"https://github.com/CrackleBuff/umbrel-headscale\" rel=\"noopener noreferrer\">github.com/CrackleBuff/umbrel-headscale</a>. Headscale docs: <a href=\"https://headscale.net/stable/\" rel=\"noopener noreferrer\">headscale.net</a>.</p></div>\n<script>\nconst reasons={ok:\"\",bad_characters:\"A setting contains a line break, tab or other non-printable character. Re-enter it as plain text.\",no_domain:\"Set \\u201cPublic domain\\u201d in this app's settings (umbrelOS \\u2192 app \\u2192 Settings).\",bad_domain:\"The public domain setting is not a valid DNS name.\",bad_email:\"The Let's Encrypt e-mail setting is not a valid address.\",bad_magicdns:\"The MagicDNS domain setting is not a valid DNS name.\",magicdns_contains_server:\"The public domain must not be the same as the MagicDNS domain or inside it.\",bad_derp:\"Tailscale DERP setting must be true or false.\",bad_loglevel:\"Log level must be debug, info, warn or error.\",bad_expiry:\"Node key expiry must be 0 or a number followed by h or d (e.g. 180d).\",unsafe_files:\"Refusing to start: the data folder contains symlinks or device files.\",implicit_allow_all:\"Refusing to start: policy.hujson has no top-level \\u201cacls\\u201d or \\u201cgrants\\u201d list (or it is null or commented out), which Headscale treats as ALLOW ALL. Add one (it may be empty, [], to deny everything).\"};\nfunction row(k,v){const tr=document.createElement('tr');const a=document.createElement('td');a.textContent=k;const b=document.createElement('td');if(v instanceof Node)b.appendChild(v);else b.textContent=v;tr.append(a,b);return tr}\nfunction flag(ok,y,n){const s=document.createElement('span');s.className=ok?'ok':'bad';s.textContent=ok?y:n;return s}\nfetch('cgi-bin/status',{cache:'no-store'}).then(r=>r.json()).then(s=>{\n const el=document.getElementById('status');el.textContent='';\n const h=document.createElement('h2');h.textContent='Status';el.appendChild(h);\n const t=document.createElement('table');\n if(s.state!=='configured'){t.append(row('State',flag(false,'','Not configured')),row('Next step',reasons[s.reason]||s.reason));}\n else{\n  document.querySelectorAll('.dom').forEach(e=>e.textContent=s.domain);\n  t.append(row('Server URL','https://'+s.domain),row('Public /health',s.checked?flag(s.publicHealth,'reachable (pass)','not reachable from this Umbrel \\u2014 check port forwarding / DNS / NAT loopback'):'not checked yet (or the check is more than 5 minutes old); reload in a minute'),\n   row('Noise public key',s.noiseKey||'unknown'),row('Note','Checked once a minute from this Umbrel (one request, no redirects). The check does not verify the TLS certificate. Use it to debug port forwarding, not as proof of identity.'),row('MagicDNS domain',s.magicdns),row('Tailscale public DERP',s.tailscaleDerp==='true'?'on':'off (embedded DERP only)'));\n }\n el.appendChild(t);\n}).catch(()=>{document.getElementById('status').textContent='Status unavailable.'});\n</script>\n</body></html>\nHSWWWINDEX\ncat > \"$$WWW/cgi-bin/status\" <<'HSWWWCGI'\n#!/bin/sh\n# Status JSON for the app page. Makes no network requests: it only reads the\n# validated state file written by init and the result file written by the\n# probe service, and passes on values that match strict patterns. A probe\n# result counts only if it is for the current domain and under 5 minutes old.\nprintf 'Content-Type: application/json\\r\\nCache-Control: no-store\\r\\nX-Content-Type-Options: nosniff\\r\\n\\r\\n'\nget() { sed -n \"s/^$$1=\\([a-z0-9._-]*\\)\\$$/\\1/p\" /status/state 2>/dev/null | head -n 1; }\nSTATE=$$(get STATE); REASON=$$(get REASON); DOMAIN=$$(get DOMAIN); TSDERP=$$(get TSDERP); MAGIC=$$(get MAGIC)\nHEALTH=false; KEY=\"\"; CHECKED=false\nif [ \"$$STATE\" = configured ] && [ -f /probe/result ]; then\n  R=$$(head -c 1024 /probe/result)   # one snapshot per request\n  PD=$$(printf '%s\\n' \"$$R\" | sed -n 's/^DOMAIN=\\([a-z0-9._-]*\\)$$/\\1/p' | head -n 1)\n  PT=$$(printf '%s\\n' \"$$R\" | sed -n 's/^TIME=\\([0-9]\\{1,12\\}\\)$$/\\1/p' | head -n 1)\n  NOW=$$(date +%s)\n  if [ -n \"$$PD\" ] && [ \"$$PD\" = \"$$DOMAIN\" ] && [ -n \"$$PT\" ] && [ \"$$NOW\" -ge \"$$PT\" ] && [ $$((NOW - PT)) -le 300 ]; then\n    CHECKED=true\n    printf '%s\\n' \"$$R\" | grep -qx 'HEALTH=true' && HEALTH=true\n    KEY=$$(printf '%s\\n' \"$$R\" | sed -n 's/^KEY=\\(mkey:[0-9a-f]\\{64\\}\\)$$/\\1/p' | head -n 1)\n  fi\nfi\n# No \"\\\" line continuation: umbrelOS's compose rewrite would break it.\nFMT='{\"state\":\"%s\",\"reason\":\"%s\",\"domain\":\"%s\",\"magicdns\":\"%s\",\"tailscaleDerp\":\"%s\",\"checked\":%s,\"publicHealth\":%s,\"noiseKey\":\"%s\"}\\n'\nprintf \"$$FMT\" \"$$STATE\" \"$$REASON\" \"$$DOMAIN\" \"$$MAGIC\" \"$$TSDERP\" \"$$CHECKED\" \"$$HEALTH\" \"$$KEY\"\nHSWWWCGI\nchown -R -h 0:0 \"$$WWW\"\nfind \"$$WWW\" -type d -exec chmod 0755 {} +\nfind \"$$WWW\" -type f -exec chmod 0644 {} +\nchmod 0755 \"$$WWW/cgi-bin/status\"\n\necho \"init: state=$$STATE reason=$$REASON\"\n"]
    volumes:
      - ${APP_DATA_DIR}/data/lib:/out/lib
      - ${APP_DATA_DIR}/data/config:/out/config
      - ${APP_DATA_DIR}/data/policy:/out/policy
      - ${APP_DATA_DIR}/data/www:/out/www
      - ${APP_DATA_DIR}/data/status:/out/status
      - ${APP_DATA_DIR}/data/probe:/out/probe

  headscale:
    image: ghcr.io/juanfont/headscale:v0.29.6@sha256:cabe84f0699913dbca9320f0883dca7565dd08df3c5be29edfabbebeff763966
    # Explicit, so a changed image entrypoint cannot run something else.
    entrypoint: ["/ko-app/headscale"]
    command: ["serve"]
    user: "65532:65532"
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 512m
    stop_grace_period: 30s
    # Internet-facing, so keep it off umbrel_main_network: it cannot reach other
    # apps' internal ports. It still has outbound internet (Let's Encrypt).
    networks: [edge]
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /var/run/headscale:size=1m,uid=65532,gid=65532,mode=0700,noexec,nosuid,nodev
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      # Control plane + embedded DERP (HTTPS, Let's Encrypt TLS-ALPN-01).
      # Forward your router's public TCP 443 to this port.
      - "30443:8443/tcp"
      # STUN for the embedded DERP server. Forward public UDP 3478 to it.
      - "3478:3478/udp"
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/headscale:ro
      # Your editable policy, mounted only so "headscale policy check" can read
      # it. Headscale itself uses the checked copy in /etc/headscale.
      - ${APP_DATA_DIR}/data/policy:/etc/headscale-policy:ro
      - ${APP_DATA_DIR}/data/lib:/var/lib/headscale
    healthcheck:
      test: ["CMD", "/ko-app/headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    # Read-only status page behind Umbrel login (via app_proxy).
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    user: "65534:65534"
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/www:/www:ro
      - ${APP_DATA_DIR}/data/status:/status:ro
      - ${APP_DATA_DIR}/data/probe:/probe:ro

  probe:
    # Checks the public URL every minute for the status page. On the private
    # edge network with Headscale, so the status page container itself never
    # makes outbound requests.
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    user: "65534:65534"
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    mem_limit: 32m
    networks: [edge]
    command: ["sh", "-c", "# Reachability probe. Runs in its own busybox container on the same private\n# network as Headscale (not on umbrel_main_network), as an unprivileged user\n# with a read-only filesystem. Every minute it sends one plain GET for /health\n# and one for /key to the public name (the same path your devices use) and\n# writes the reduced result to /probe/result for the status page.\n# It sends exactly one request per path and never follows redirects, so a\n# hijacked name or compromised server cannot point it at other addresses.\n# busybox TLS does not verify certificates: the result is a hint for\n# debugging port forwarding, not proof of identity.\nset -u\nget() { sed -n \"s/^$$1=\\([a-z0-9._-]*\\)\\$$/\\1/p\" /status/state 2>/dev/null | head -n 1; }\nreq() {  # req PATH -> first 4 KB of the raw response, or nothing unless HTTP 200\n  _r=$$(printf 'GET %s HTTP/1.0\\r\\nHost: %s\\r\\nUser-Agent: umbrel-headscale-probe\\r\\nConnection: close\\r\\n\\r\\n' \"$$1\" \"$$DOMAIN\" |\n    timeout 8 ssl_client -n \"$$DOMAIN\" \"$$DOMAIN:443\" 2>/dev/null | head -c 4096)\n  case \"$$_r\" in \"HTTP/1.1 200 \"*|\"HTTP/1.0 200 \"*) printf '%s\\n' \"$$_r\";; esac\n}\nwhile :; do\n  STATE=$$(get STATE); DOMAIN=$$(get DOMAIN)\n  if [ \"$$STATE\" = configured ] && [ -n \"$$DOMAIN\" ]; then\n    HEALTH=false\n    if req /health | grep -q '\"status\":\"pass\"'; then HEALTH=true; fi\n    KEY=$$(req '/key?v=130' | grep -o 'mkey:[0-9a-f]\\{64\\}' | head -n 1)\n    { echo \"DOMAIN=$$DOMAIN\"; echo \"TIME=$$(date +%s)\"; echo \"HEALTH=$$HEALTH\"; echo \"KEY=$$KEY\"; } > /probe/result.new &&\n      mv -f /probe/result.new /probe/result\n  fi\n  sleep 60\ndone\n"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/status:/status:ro
      - ${APP_DATA_DIR}/data/probe:/probe

networks:
  # Private bridge network for the internet-facing headscale service (and its probe).
  edge: {}
