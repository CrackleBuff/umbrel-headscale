    command: ["sh", "-c", "# Runs as root in a throwaway busybox container with no network, a read-only\n# root filesystem and only CHOWN, DAC_OVERRIDE and FOWNER. It:\n#   1. validates the user's settings,\n#   2. renders /etc/headscale/config.yaml,\n#   3. creates a default-deny policy if none exists,\n#   4. fixes ownership and permissions of Headscale's state (uid 65532, 0700/0600),\n#   5. writes the status page.\n# It never reads or prints key material. Re-run on every app start.\nset -eu\numask 077\n\nHS_UID=65532\nHS_GID=65532\nCFG=/out/config\nLIB=/out/lib\nPOL=/out/policy\nWWW=/out/www\nST=/out/status\n\nDOMAIN=$$(printf '%s' \"$${HS_SERVER_DOMAIN:-}\" | tr 'A-Z' 'a-z' | tr -d ' ')\nEMAIL=$$(printf '%s' \"$${HS_ACME_EMAIL:-}\" | tr -d ' ')\nMAGIC=$$(printf '%s' \"$${HS_MAGICDNS_DOMAIN:-tailnet.internal}\" | tr 'A-Z' 'a-z' | tr -d ' ')\nTSDERP=$$(printf '%s' \"$${HS_TAILSCALE_DERP:-false}\" | tr 'A-Z' 'a-z')\nLOGLEVEL=$$(printf '%s' \"$${HS_LOG_LEVEL:-info}\" | tr 'A-Z' 'a-z')\nEXPIRY=$$(printf '%s' \"$${HS_NODE_EXPIRY:-0}\" | tr 'A-Z' 'a-z')\n\nHOSTRE='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$$'\nSTATE=configured\nREASON=ok\n\nfail() { STATE=unconfigured; REASON=$$1; }\n\nif [ -z \"$$DOMAIN\" ]; then fail no_domain\nelif ! printf '%s' \"$$DOMAIN\" | grep -Eq \"$$HOSTRE\" || [ $${#DOMAIN} -gt 253 ]; then fail bad_domain\nfi\nif [ \"$$STATE\" = configured ]; then\n  if [ -n \"$$EMAIL\" ] && ! printf '%s' \"$$EMAIL\" | grep -Eq '^[A-Za-z0-9._%+-]{1,64}@([A-Za-z0-9-]{1,63}\\.)+[A-Za-z]{2,63}$$'; then fail bad_email\n  elif ! printf '%s' \"$$MAGIC\" | grep -Eq \"$$HOSTRE\"; then fail bad_magicdns\n  elif [ \"$$MAGIC\" = \"$$DOMAIN\" ] || case \"$$DOMAIN\" in *.\"$$MAGIC\") true;; *) false;; esac; then fail magicdns_contains_server\n  elif [ \"$$TSDERP\" != true ] && [ \"$$TSDERP\" != false ]; then fail bad_derp\n  elif ! printf '%s' \"$$LOGLEVEL\" | grep -Eq '^(debug|info|warn|error)$$'; then fail bad_loglevel\n  elif ! printf '%s' \"$$EXPIRY\" | grep -Eq '^(0|[1-9][0-9]{0,4}(h|d))$$'; then fail bad_expiry\n  fi\nfi\n# Headscale accepts Go durations; convert days to hours.\ncase \"$$EXPIRY\" in *d) EXPIRY=\"$$(( $${EXPIRY%d} * 24 ))h\";; esac\n\n# Refuse symlinks/devices anywhere in the state we are about to chown.\nfor d in \"$$LIB\" \"$$POL\" \"$$CFG\"; do\n  if [ -n \"$$(find \"$$d\" \\( -type l -o -type b -o -type c -o -type p \\) 2>/dev/null | head -n 1)\" ]; then\n    fail unsafe_files\n  fi\ndone\n\n# An existing policy with no \"acls\"/\"grants\" list (e.g. empty file or \"{}\")\n# makes Headscale ALLOW ALL traffic. Refuse to start rather than fail open.\nif [ \"$$STATE\" = configured ] && [ -e \"$$POL/policy.hujson\" ]; then\n  if [ ! -f \"$$POL/policy.hujson\" ] || ! sed 's://.*$$::' \"$$POL/policy.hujson\" | grep -Eq '\"(acls|grants)\"[[:space:]]*:'; then\n    fail implicit_allow_all\n  fi\nfi\n\nmkdir -p \"$$CFG\" \"$$WWW/cgi-bin\" \"$$ST\"\n\nif [ \"$$STATE\" = configured ]; then\n  if [ \"$$TSDERP\" = true ]; then DERPURLS='[\"https://controlplane.tailscale.com/derpmap/default\"]'; else DERPURLS='[]'; fi\n  cat > \"$$CFG/config.yaml.new\" <<CONF\n# Generated by the app on every start from the app's settings. Do not edit:\n# changes are overwritten. Change settings in umbrelOS instead.\nserver_url: https://$$DOMAIN\nlisten_addr: 0.0.0.0:8443\nmetrics_listen_addr: 127.0.0.1:9090\ngrpc_listen_addr: 127.0.0.1:50443\ngrpc_allow_insecure: false\ntrusted_proxies: []\nnoise:\n  private_key_path: /var/lib/headscale/noise_private.key\nprefixes:\n  v4: 100.64.0.0/10\n  v6: fd7a:115c:a1e0::/48\n  allocation: sequential\nderp:\n  server:\n    enabled: true\n    region_id: 999\n    region_code: \"umbrel\"\n    region_name: \"Umbrel embedded DERP\"\n    verify_clients: true\n    stun_listen_addr: \"0.0.0.0:3478\"\n    private_key_path: /var/lib/headscale/derp_server_private.key\n    automatically_add_embedded_derp_region: true\n  urls: $$DERPURLS\n  paths: []\n  auto_update_enabled: $$TSDERP\n  update_frequency: 24h\ndisable_check_updates: true\nnode:\n  expiry: $$EXPIRY\n  ephemeral:\n    inactivity_timeout: 30m\ndatabase:\n  type: sqlite\n  sqlite:\n    path: /var/lib/headscale/db.sqlite\n    write_ahead_log: true\n    wal_autocheckpoint: 1000\nacme_url: https://acme-v02.api.letsencrypt.org/directory\nacme_email: \"$$EMAIL\"\ntls_letsencrypt_hostname: \"$$DOMAIN\"\ntls_letsencrypt_cache_dir: /var/lib/headscale/cache\ntls_letsencrypt_challenge_type: TLS-ALPN-01\ntls_cert_path: \"\"\ntls_key_path: \"\"\nlog:\n  level: $$LOGLEVEL\n  format: text\npolicy:\n  mode: file\n  path: /etc/headscale-policy/policy.hujson\ndns:\n  magic_dns: true\n  base_domain: $$MAGIC\n  override_local_dns: false\n  nameservers:\n    global: []\n    split: {}\n  search_domains: []\n  extra_records: []\nunix_socket: /var/run/headscale/headscale.sock\nunix_socket_permission: \"0770\"\nlogtail:\n  enabled: false\ntaildrop:\n  enabled: true\nauto_update:\n  enabled: false\nCONF\n\n  # Default-deny policy, created only if the user has none yet. Never overwritten.\n  if [ ! -e \"$$POL/policy.hujson\" ]; then\n    cat > \"$$POL/policy.hujson\" <<'POLICY'\n// Headscale access policy (HuJSON). Default: DENY ALL.\n// Nodes can join, but cannot reach each other until you add rules.\n// Edit this file, then restart the app. Examples:\n// https://headscale.net/stable/ref/policy/  and the app's README.\n//\n// IMPORTANT: an empty file or \"{}\" means ALLOW ALL. Keep an \"acls\"\n// (or \"grants\") list in this file, even if it is empty.\n{\n  \"groups\": {},\n  \"tagOwners\": {},\n  \"hosts\": {},\n  \"acls\": []\n}\nPOLICY\n  fi\n  mkdir -p \"$$LIB/cache\"\n  chown -R -h \"$$HS_UID:$$HS_GID\" \"$$LIB\"\n  find \"$$LIB\" -type d -exec chmod 0700 {} +\n  find \"$$LIB\" -type f -exec chmod 0600 {} +\n  chown -h \"0:$$HS_GID\" \"$$POL\" \"$$POL/policy.hujson\"\n  chmod 0750 \"$$POL\"; chmod 0640 \"$$POL/policy.hujson\"\nelse\n  # Not configured: run Headscale in an inert, localhost-only mode with state\n  # in tmpfs, so nothing is created in the data folder (keys, db) and nothing\n  # answers on the published ports. This keeps the data folder empty, which is\n  # what the migration (copy existing state in) relies on.\n  cat > \"$$CFG/config.yaml.new\" <<'CONF'\n# Not configured yet. Set \"Public domain\" in the app's settings.\nserver_url: http://127.0.0.1:8443\nlisten_addr: 127.0.0.1:8443\nmetrics_listen_addr: 127.0.0.1:9090\ngrpc_listen_addr: 127.0.0.1:50443\nnoise:\n  private_key_path: /tmp/inert/noise_private.key\nprefixes:\n  v4: 100.64.0.0/10\n  v6: fd7a:115c:a1e0::/48\nderp:\n  server:\n    enabled: false\n  urls: []\n  paths: [/etc/headscale/derp-inert.yaml]\n  auto_update_enabled: false\ndisable_check_updates: true\ndatabase:\n  type: sqlite\n  sqlite:\n    path: /tmp/inert/db.sqlite\nlog:\n  level: warn\npolicy:\n  mode: file\n  path: \"\"\ndns:\n  magic_dns: false\n  override_local_dns: false\nunix_socket: /var/run/headscale/headscale.sock\nunix_socket_permission: \"0770\"\nlogtail:\n  enabled: false\nCONF\n  # Headscale refuses to start without a DERP map; give it an unreachable one.\n  cat > \"$$CFG/derp-inert.yaml\" <<'DERP'\nregions:\n  900:\n    regionid: 900\n    regioncode: inert\n    regionname: Not configured\n    nodes:\n      - name: 900a\n        regionid: 900\n        hostname: localhost\n        ipv4: 127.0.0.1\n        stunport: -1\n        derpport: 1\nDERP\n  chown -h \"0:$$HS_GID\" \"$$CFG/derp-inert.yaml\"; chmod 0640 \"$$CFG/derp-inert.yaml\"\nfi\n# Remove the inert DERP map once configured.\nif [ \"$$STATE\" = configured ]; then rm -f \"$$CFG/derp-inert.yaml\"; fi\n\nchown -h \"0:$$HS_GID\" \"$$CFG\" \"$$CFG/config.yaml.new\"\nchmod 0750 \"$$CFG\"; chmod 0640 \"$$CFG/config.yaml.new\"\nmv -f \"$$CFG/config.yaml.new\" \"$$CFG/config.yaml\"\n\n# Status page state: only validated values, no secrets.\n{\n  echo \"STATE=$$STATE\"\n  echo \"REASON=$$REASON\"\n  if [ \"$$STATE\" = configured ]; then echo \"DOMAIN=$$DOMAIN\"; echo \"TSDERP=$$TSDERP\"; echo \"MAGIC=$$MAGIC\"; fi\n} > \"$$ST/state.new\"\nchmod 0644 \"$$ST/state.new\"; mv -f \"$$ST/state.new\" \"$$ST/state\"\nchmod 0755 \"$$ST\"\n\n# Status page files (static HTML + one CGI). Rewritten on every start.\ncat > \"$$WWW/index.html\" <<'HSWWWINDEX'\n<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Headscale</title>\n<style>\nbody{font-family:system-ui,-apple-system,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;color:#1d1d1f;background:#fafafa}\nh1{font-size:1.6rem}code,pre{background:#eee;border-radius:4px;padding:.1rem .3rem;font-size:.9em}pre{padding:.6rem;overflow:auto}\n.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem 1.2rem;margin:1rem 0}\n.ok{color:#0a7d32}.bad{color:#b00020}.muted{color:#666}td{padding:.2rem .8rem .2rem 0;vertical-align:top}\n</style></head><body>\n<h1>Headscale</h1>\n<p class=\"muted\">Self-hosted Tailscale control server. This page is protected by your Umbrel login and only shows status; it cannot change anything.</p>\n<div class=\"card\" id=\"status\">Loading status...</div>\n<div class=\"card\">\n<h2>Connect a device</h2>\n<p>Official Tailscale apps work with Headscale. Point them at your server URL:</p>\n<pre>tailscale up --login-server https://<span class=\"dom\">YOUR-DOMAIN</span></pre>\n<p>On iOS/macOS/Android set a custom coordination server in the app settings. The device shows a register page with an ID; approve it on the Umbrel (Settings &rarr; Advanced &rarr; Terminal):</p>\n<pre>sudo docker exec cracklebuff-headscale_headscale_1 headscale users create alice\nsudo docker exec cracklebuff-headscale_headscale_1 headscale auth register --user alice --auth-id &lt;ID&gt;</pre>\n<p>New tailnets <b>deny all traffic</b> until you add rules to the policy file. See the README.</p>\n</div>\n<div class=\"card\"><h2>Docs</h2><p>README, threat model and backup/upgrade notes: <a href=\"https://github.com/CrackleBuff/umbrel-headscale\" rel=\"noopener noreferrer\">github.com/CrackleBuff/umbrel-headscale</a>. Headscale docs: <a href=\"https://headscale.net/stable/\" rel=\"noopener noreferrer\">headscale.net</a>.</p></div>\n<script>\nconst reasons={ok:\"\",no_domain:\"Set \\u201cPublic domain\\u201d in this app's settings (umbrelOS \\u2192 app \\u2192 Settings).\",bad_domain:\"The public domain setting is not a valid DNS name.\",bad_email:\"The Let's Encrypt e-mail setting is not a valid address.\",bad_magicdns:\"The MagicDNS domain setting is not a valid DNS name.\",magicdns_contains_server:\"The MagicDNS domain must not equal or contain the public domain.\",bad_derp:\"Tailscale DERP setting must be true or false.\",bad_loglevel:\"Log level must be debug, info, warn or error.\",bad_expiry:\"Node key expiry must be 0 or a number followed by h or d (e.g. 180d).\",unsafe_files:\"Refusing to start: the data folder contains symlinks or device files.\",implicit_allow_all:\"Refusing to start: policy.hujson has no \\u201cacls\\u201d or \\u201cgrants\\u201d list, which Headscale treats as ALLOW ALL. Add one (it may be empty to deny everything).\"};\nfunction row(k,v){const tr=document.createElement('tr');const a=document.createElement('td');a.textContent=k;const b=document.createElement('td');if(v instanceof Node)b.appendChild(v);else b.textContent=v;tr.append(a,b);return tr}\nfunction flag(ok,y,n){const s=document.createElement('span');s.className=ok?'ok':'bad';s.textContent=ok?y:n;return s}\nfetch('cgi-bin/status',{cache:'no-store'}).then(r=>r.json()).then(s=>{\n const el=document.getElementById('status');el.textContent='';\n const h=document.createElement('h2');h.textContent='Status';el.appendChild(h);\n const t=document.createElement('table');\n if(s.state!=='configured'){t.append(row('State',flag(false,'','Not configured')),row('Next step',reasons[s.reason]||s.reason));}\n else{\n  document.querySelectorAll('.dom').forEach(e=>e.textContent=s.domain);\n  t.append(row('Server URL','https://'+s.domain),row('Public /health',flag(s.publicHealth,'reachable (pass)','not reachable from this Umbrel \\u2014 check port forwarding / DNS / NAT loopback')),\n   row('Noise public key',s.noiseKey||'unknown'),row('MagicDNS domain',s.magicdns),row('Tailscale public DERP',s.tailscaleDerp==='true'?'on':'off (embedded DERP only)'));\n }\n el.appendChild(t);\n}).catch(()=>{document.getElementById('status').textContent='Status unavailable.'});\n</script>\n</body></html>\nHSWWWINDEX\ncat > \"$$WWW/cgi-bin/status\" <<'HSWWWCGI'\n#!/bin/sh\n# Status JSON for the app page. Reads only the validated state file written by\n# init and checks the public URL. Never echoes remote content: results are\n# reduced to booleans or a strictly matched public key.\nprintf 'Content-Type: application/json\\r\\nCache-Control: no-store\\r\\nX-Content-Type-Options: nosniff\\r\\n\\r\\n'\nget() { sed -n \"s/^$$1=\\([a-z0-9._-]*\\)\\$$/\\1/p\" /status/state 2>/dev/null | head -n 1; }\nSTATE=$$(get STATE); REASON=$$(get REASON); DOMAIN=$$(get DOMAIN); TSDERP=$$(get TSDERP); MAGIC=$$(get MAGIC)\nHEALTH=false; KEY=\"\"\nif [ \"$$STATE\" = configured ] && [ -n \"$$DOMAIN\" ]; then\n  if timeout 8 wget -q -T 6 -O - \"https://$$DOMAIN/health\" 2>/dev/null | grep -q '\"status\":\"pass\"'; then HEALTH=true; fi\n  KEY=$$(timeout 8 wget -q -T 6 -O - \"https://$$DOMAIN/key?v=130\" 2>/dev/null | grep -o 'mkey:[0-9a-f]\\{64\\}' | head -n 1)\nfi\nprintf '{\"state\":\"%s\",\"reason\":\"%s\",\"domain\":\"%s\",\"magicdns\":\"%s\",\"tailscaleDerp\":\"%s\",\"publicHealth\":%s,\"noiseKey\":\"%s\"}\\n' \\\n  \"$$STATE\" \"$$REASON\" \"$$DOMAIN\" \"$$MAGIC\" \"$$TSDERP\" \"$$HEALTH\" \"$$KEY\"\nHSWWWCGI\nchown -R -h 0:0 \"$$WWW\"\nfind \"$$WWW\" -type d -exec chmod 0755 {} +\nfind \"$$WWW\" -type f -exec chmod 0644 {} +\nchmod 0755 \"$$WWW/cgi-bin/status\"\n\necho \"init: state=$$STATE reason=$$REASON\"\n"]
    volumes:
